{% extends 'base.html'%}

{% block content %}
<h3 class="text-uppercase text-warning" style="letter-spacing:2px">Search Result</h3>

<div class="row mb-2">
  {% for post in search_item %}

    <div class="col-md-6">
      <div class="card border-0">
        <div class="card-body">
            <a href="{% url 'slug_blog' post.slug %}" class="text-dark" > <h3>{{ post.title }}</h3> </a>
          <small class="mb-1 text-muted">
            {{ post.created_at|timesince }} ago | {{ post.author }}
          </small>
          <p class="card-text">{{ post.short_description }}</p>
        </div>
      </div>
    </div>
    {% empty %}
    <span>No blog found</span>

  {% endfor %}


</div>

{% endblock %}
