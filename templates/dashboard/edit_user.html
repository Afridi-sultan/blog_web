<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% extends 'base.html'%}
{% block content %}
{% load crispy_forms_tags %}


<div class="container-fluid">
    <div class="row">
{% include 'dashboard/sidebar.html' %}


        <main class="col-md-10 bg-light p-4">

            <h2>Edit User</h2>
            <hr>


                <form action="{% url 'edit_user' main_user.id %}" method="post" style="width:500px; margin:auto;">
                    {% csrf_token %}
                    {{ form | crispy }}
                    <button type="submit" class="btn btn-warning">Update</button>
                </form>





        </main>

    </div>
</div>

{% endblock %}
</body>
</html>
