{% extends 'base.html'%}

{% block content %}


<div class="container-fluid">
    <div class="row">
{% include 'dashboard/sidebar.html' %}



        <main class="col-md-10 bg-light p-4">

            <div class="d-flex align-items-center shadow-sm p-2 bg-white rounded-pill border">
                <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-2" style="width: 30px; height: 30px;">
                    {{ user.username|slice:":1"|upper }}
                </div>
                <span class="text-secondary fw-bold me-2">&emsp;Logged in as {{ user}}!</span>
            </div>

            <h2>Dashboard Overview</h2>
            <hr>


            <div class="row">
                <div class="col-md-6">
                    <div class="card text-white bg-primary mb-3">
                        <div class="card-body text-center">
                            <h5 class="card-title">All Categories</h5>
                            <p class="card-text display-4">{{category_count}}</p>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card text-white bg-success mb-3">
                        <div class="card-body text-center">
                            <h5 class="card-title">Posts</h5>
                            <p class="card-text display-4">{{blog_count}}</p>
                        </div>
                    </div>
                </div>
            </div>

        </main>

    </div>
</div>
{% endblock %}
