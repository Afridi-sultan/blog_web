<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% extends 'base.html'%}
{% block content %}


<div class="container-fluid">
    <div class="row">
{% include 'dashboard/sidebar.html' %}


        <main class="col-md-10 bg-light p-4">
            <h2>All Blogs</h2>


            <div class="row">
               <table class="table table-hover">
                      <thead>
                        <tr>
                          <th>Sl No</th>
                          <th>Blog Title</th>
                          <th>Created at</th>
                          <th> Action</th>
                        </tr>
                      </thead>
                      <tbody>
                      {% for blog in all_blogs %}
                        <tr>
                          <td >{{forloop.counter}}</td>
                          <td>{{blog.title}}</td>
                          <td>{{blog.created_at}}</td>
                          <td>
                              <div class="d-flex gap-1">
                                  <a href="" class="btn btn-warning btn-sm mr-3">Edit</a>
                                  <a href="" class="btn btn-danger btn-sm">Delete</a>
                              </div>
                          </td>

                        </tr>
                      {% endfor %}

                      </tbody>
                    </table>
            </div>

        </main>

    </div>
</div>

{% endblock %}
</body>
</html>
